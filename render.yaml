services:
  # 1. TenderLens Web & WhatsApp Webhook API Gateway
  - type: web
    name: tenderlens-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn src.tenderlens.gateway.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenderlens-db
          property: connectionString
      - key: TEMPORAL_HOST
        value: temporal.internal:7233
      - key: TEMPORAL_NAMESPACE
        value: default
      - key: LLM_MODEL
        value: gemma2:9b
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true

  # 2. TenderLens Temporal Background Follow-Through Worker
  - type: worker
    name: tenderlens-temporal-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: python -m src.tenderlens.workflows.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenderlens-db
          property: connectionString
      - key: TEMPORAL_HOST
        value: temporal.internal:7233
      - key: TEMPORAL_NAMESPACE
        value: default

databases:
  # 3. Persistent PostgreSQL Database
  - name: tenderlens-db
    databaseName: tenderlens
    user: tenderlens_admin
    region: oregon
    plan: starter
