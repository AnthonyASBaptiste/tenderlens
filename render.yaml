services:
  # 1. TenderLens Web & WhatsApp Webhook API Gateway
  - type: web
    name: tenderlens-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn src.tenderlens.gateway.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenderlens-db
          property: connectionString
      - key: MAGIC_LINK_SECRET
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: gemma2-9b-it
      - key: LLM_API_KEY
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TEMPORAL_HOST
        value: localhost:7233

  # 2. TenderLens Temporal Background Follow-Through Worker
  - type: worker
    name: tenderlens-temporal-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: python -m src.tenderlens.workflows.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenderlens-db
          property: connectionString
      - key: TEMPORAL_HOST
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false

databases:
  # 3. Persistent PostgreSQL Database
  - name: tenderlens-db
    databaseName: tenderlens
    user: tenderlens_admin
    region: oregon
    plan: free
