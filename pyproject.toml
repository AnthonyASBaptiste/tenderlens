[project]
name = "tenderlens"
version = "0.1.0"
description = "TenderLens T&T: Open-Source AI Tender Readiness & Follow-Through Assistant"
authors = [
    { name = "Anthony Baptiste" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pypdf>=5.0.0",
    "pillow>=10.4.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "temporalio>=1.7.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
